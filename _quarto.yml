# version 3.2

project:
  type: website
  output-dir: docs

# Info on changing metadata labels: https://quarto.org/docs/authoring/title-blocks.html#metadata-labels
published-title: "Last Modified"
author-title: "Authors"

website:
  title: "LDRS 101 Course Notes"

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: u1.qmd
        text: Unit 1
      - href: u2.qmd
        text: Unit 2
      - href: u3.qmd
        text: Unit 3
      - href: u4.qmd
        text: Unit 4
      - href: u5.qmd
        text: Unit 5
      - href: u6.qmd
        text: Unit 6
      - text: Assignments
        menu:
          - text: Assignment 1
            href: assignment1.qmd
          - text: Assignment 2
            href: assignment1.qmd
          - text: Assignment 3
            href: assignment3.qmd
      - text: Course Assessment
        href: course_assessment.qmd

sidebar:
  style: "docked"
  search: true
  contents:
    - section: "Units"
      contents:
        - u1.qmd
        - u2.qmd
        - u3.qmd
        - u4.qmd
        - u5.qmd
        - u6.qmd
    - section: "Assignments"
      contents:
        - assignment1.qmd
        - assignment2.qmd
        - assignment3.qmd
    - section: "Other"
      contents:
        - course_assessment.qmd

# # ------- Project Settings -------

#   author: "Colin Madland and Kelly Marjanovic"
#   date: "last-modified"
#   date-format: "MMM D, YYYY"
#   chapters:
#     - index.qmd
#     - u1.qmd
#     - u2.qmd
#     - u3.qmd
#     - u4.qmd
#     - u5.qmd
#     - u6.qmd
#     - assignment1.qmd
#     - assignment2.qmd
#     - assignment3.qmd
#     - course_assessment.qmd
#     # - listings-meta.qmd

# # Note: If you do not have any Zotero references, you should disable the 'references.qmd' file or else it will cause an error when rendering.
# #    - references.qmd

# References
bibliography: https://twuonline.github.io/course-materials/quarto/references.bib
csl: https://twuonline.github.io/course-materials/quarto/apa.csl
link-bibliography: true
link-citations: false

# Lua Filters
filters:
  - at: pre-ast
    path: yml-assets/pre.lua
  - at: post-render
    path: yml-assets/post.lua

# Add templete for block
title-block-banner: true

# ------- Format Specific Settings -------

format:
  # Format - HTML
  html:
    template-partials: yml-assets/title-block.html

    sidebar:
      style: "docked"
      search: true
    css: https://twuonline.github.io/course-materials/quarto/twu_styles.css
    toc-depth: 4
    toc: true
    toc-title: On This Page
    theme: cosmo
    # The line below  should only be enabled to locally test css before moving it to the main css file in course materials.
    #theme: [cosmo, yml-assets/test.scss]
    include-in-header:
      - text: |
          <link rel = "shortcut icon" href = "https://twuonline.github.io/course-materials/quarto/favicon.ico" />

  # # Format - PDF
  #   pdf:
  #     documentclass: scrreprt

  # Format - Doc
  docx:
    toc: false
    number-sections: true
    highlight-style: github
  #   cite-method: biblatex
# Fig captions
fig-cap-location: top
lightbox:
  desc-position: top
